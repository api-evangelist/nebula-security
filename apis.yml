aid: nebula-security
name: Nebula Security
description: >-
  Nebula Security is an AI-native cybersecurity company backed by Y Combinator (S26)
  and founded by world-class hackers — members of a top CTF team, DEF CON winners,
  Black Hat speakers, and cybersecurity PhDs. Its product, Vega, is an AI security
  agent that audits codebases for vulnerabilities on the Vega backend, alongside
  human-led product security auditing. Vega runs from the terminal via the Vega CLI
  (`vega`), which is distributed as an installable Agent Skill and an npm/global
  binary, authenticates with an API key or OAuth login, and exposes a
  project → repository → scan → finding drill-down. The team publishes vulnerability
  research (e.g. an nginx RCE, CVE-2026-42530) and positions "Audited by Nebula
  Security" as a product credibility marker.
